<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIMARK Animated Email Signature Banner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f1720;
      font-family: Arial, sans-serif;
    }

    .banner {
      position: relative;
      width: 900px;
      height: 240px;
      overflow: hidden;
      border-radius: 24px;
      background: linear-gradient(135deg, #1f3445 0%, #44657a 100%);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .banner::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
      animation: rotateGlow 12s linear infinite;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
    }

    .light-beam {
      position: absolute;
      top: -20%;
      left: -30%;
      width: 50%;
      height: 180%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.14),
        transparent
      );
      transform: rotate(18deg);
      animation: beamMove 5s ease-in-out infinite;
    }

    .content {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 40px 60px;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .logo-container {
      position: relative;
      width: 320px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-container::after {
      content: "";
      position: absolute;
      width: 340px;
      height: 160px;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 0 40px rgba(255,255,255,0.06);
    }

    .logo {
      width: 100%;
      max-width: 320px;
      filter: brightness(1.08);
      position: relative;
      z-index: 2;
    }

    .text-block {
      display: none;
    }

    .right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      text-align: right;
      color: rgba(255,255,255,0.85);
      min-width: 280px;
      gap: 4px;
    }

    .service-line {
      font-size: 14px;
      margin-bottom: 0px;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.82);
    }

    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      width: 100%;
      background: linear-gradient(90deg, transparent, #ffffff, transparent);
      animation: loadingBar 3s ease-in-out infinite;
    }

    @keyframes rotateGlow {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes beamMove {
      0% {
        transform: translateX(-120%) rotate(18deg);
      }
      100% {
        transform: translateX(260%) rotate(18deg);
      }
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.4;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes loadingBar {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    @media (max-width: 940px) {
      .banner {
        width: 100%;
        border-radius: 0;
      }

      .content {
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        text-align: center;
      }

      .right {
        text-align: center;
      }

      .headline {
        font-size: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="grid-overlay"></div>
    <div class="light-beam"></div>

    <div class="content">
      <div class="left">
        <div class="logo-container">
          <img
            class="logo"
            src="email logo.png"
            alt="HIMARK Logo"
          />
        </div>

        <div class="text-block">
          
        </div>
      </div>

      <div class="right">
        <div class="service-line">Strategic Growth Consulting</div>
        <div class="service-line">Digital Infrastructure</div>
        <div class="service-line">Automation & Systems</div>
        <div class="service-line">Marketing Campaign Engineering</div>
      </div>
    </div>

    <div class="bottom-bar"></div>
  </div>
</body>
</html>
